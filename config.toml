baseURL = "https://ziyingchen-dev.github.io/EngineeringWiki/"
title = "EngineeringWiki"
theme = "relearn"
defaultContentLanguage = "en"

[params]
themeVariant = [
  "zen-light",
  "zen-dark"
]

disableLandingPageButton = true
disableInlineCopyToClipBoard = false

[outputs]
home = ["HTML","RSS","SEARCH"]

[markup.goldmark.renderer]
unsafe = true

[markup.tableOfContents]
startLevel = 2
endLevel = 3
ordered = false
